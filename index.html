<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Машина времени — с юбилеем!</title>
<meta name="description" content="Машина времени: путешествие по годам жизни к юбилею">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕰️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="brand">
    <span class="brand-icon">🕰️</span>
    <span class="brand-text">Машина времени <span class="brand-dot">·</span> <span id="person-name">Мама</span></span>
  </header>

  <main class="scene" id="scene">

    <div class="scene-photo" id="scene-photo">
      <img id="period-photo" alt="" />
      <div class="photo-fallback" id="photo-fallback">
        <span class="fallback-blob fallback-blob-1"></span>
        <span class="fallback-blob fallback-blob-2"></span>
        <span class="fallback-icon">📷</span>
        <span class="fallback-text" id="photo-placeholder-text">Добавьте фото этих лет</span>
      </div>
    </div>

    <div class="scene-text">
      <div class="year-block">
        <span class="year-num" id="year-value">1971</span>
        <span class="age-line" id="age-pill">родилась</span>
      </div>

      <h2 class="period-title">
        <span class="period-emoji" id="period-emoji">🍼</span>
        <span id="period-title-text">Малышка</span>
      </h2>

      <p class="period-location" id="period-location">📍 —</p>

      <ul class="period-events" id="period-events"></ul>

      <p class="finale-line" id="finale-line" hidden></p>
    </div>

    <div class="now-playing" id="now-playing">
      <button class="np-toggle" id="np-toggle" type="button" aria-expanded="false">
        <span class="np-note">🎵</span>
        <span class="np-text" id="song-meta">—</span>
        <span class="np-caret">▾</span>
      </button>
      <div class="np-panel" id="song-embed"></div>
    </div>

  </main>

  <footer class="timeline">
    <button class="play-btn" id="play-btn" type="button" aria-label="Запустить машину времени">
      <span id="play-icon">▶</span>
    </button>

    <div class="slider-block">
      <input type="range" id="year-slider" class="year-slider" min="1971" max="2026" step="1" value="1971"
             aria-label="Выберите год">
      <div class="slider-ticks" id="slider-ticks"></div>
    </div>
  </footer>

<script src="script.js"></script>
</body>
</html>
